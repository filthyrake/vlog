# VLog Worker NetworkPolicy
# kubectl apply -f k8s/networkpolicy.yaml
#
# This policy restricts network access for worker pods to minimize
# the blast radius if a pod is compromised. Workers only need:
#   1. Egress to DNS for hostname resolution
#   2. Egress to the Worker API (port 9002)
#   3. Optionally, egress to Redis for job queue (port 6379)
#
# ===========================================================================
# IMPORTANT: CNI COMPATIBILITY
# ===========================================================================
# NetworkPolicy requires a CNI that supports it:
#   - Calico (recommended)
#   - Cilium
#   - Weave Net
#   - Azure CNI
#
# Default k3s/k8s networking does NOT enforce NetworkPolicy without a
# compatible CNI installed. Verify your CNI supports NetworkPolicy before
# relying on this for security.
#
# To test if NetworkPolicy is enforced, apply this policy and verify that
# workers can still reach the API but cannot reach other services.
#
# ===========================================================================
# CONFIGURATION SUMMARY
# ===========================================================================
# This file has TWO options for each egress rule:
#   - Option A (ACTIVE): IP-based rules for external services
#   - Option B (COMMENTED): Namespace/pod selectors for in-cluster services
#
# Review each section and enable the appropriate option for your deployment.
# Current defaults:
#   - Worker API: Option A enabled (external IP range 10.0.0.0/8)
#   - Redis:      Option A enabled (external IP range 10.0.0.0/8)
#   - NFS/SMB:    Commented out (not enabled)

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vlog-worker-network-policy
  namespace: vlog
  labels:
    app.kubernetes.io/name: vlog
    app.kubernetes.io/component: worker
spec:
  # Apply to all worker pods
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vlog
      app.kubernetes.io/component: worker

  policyTypes:
    - Ingress
    - Egress

  # Workers don't need any inbound connections
  # Empty list = deny all ingress (workers pull work, never receive connections)
  ingress: []

  egress:
    # =========================================================================
    # DNS RESOLUTION (REQUIRED - do not modify)
    # =========================================================================
    # Workers need DNS to resolve hostnames in VLOG_WORKER_API_URL.
    # Targets the kube-system namespace where CoreDNS/kube-dns runs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # =========================================================================
    # WORKER API EGRESS - REQUIRED
    # =========================================================================
    # Workers need to communicate with the Worker API for:
    #   - Job polling and claiming
    #   - Progress updates and heartbeats
    #   - File downloads (source videos) and uploads (HLS output)
    #
    # Choose ONE option below based on your deployment:
    #
    # -------------------------------------------------------------------------
    # OPTION A (CURRENTLY ACTIVE): External Worker API with IP/CIDR
    # -------------------------------------------------------------------------
    # Use this if the Worker API runs outside the Kubernetes cluster or
    # you prefer IP-based rules.
    #
    # REQUIRED: Replace the CIDR with your actual Worker API server IP or range.
    # Examples:
    #   - 192.168.1.100/32  (single host - most restrictive)
    #   - 10.0.1.0/24       (subnet - allows any host in 10.0.1.x)
    #   - 10.0.0.0/8        (broad range - current default, consider narrowing)
    #
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8  # <-- CHANGE THIS to your API server IP/CIDR
            # Optional: Exclude specific IPs within the range
            # except:
            #   - 10.0.0.1/32  # e.g., exclude gateway
      ports:
        - protocol: TCP
          port: 9002  # Worker API port
        - protocol: TCP
          port: 443   # HTTPS (if using TLS termination)

    # -------------------------------------------------------------------------
    # OPTION B (COMMENTED): In-cluster Worker API
    # -------------------------------------------------------------------------
    # Use this instead of Option A if the Worker API runs as a K8s service
    # in the same cluster. This is more secure as it uses pod selectors
    # rather than IP ranges.
    #
    # To enable: Comment out Option A above, uncomment the block below,
    # and adjust the namespace/labels to match your deployment.
    #
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: vlog  # Namespace where API runs
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: vlog
    #           app.kubernetes.io/component: server  # Or 'worker-api' if separate
    #   ports:
    #     - protocol: TCP
    #       port: 9002

    # =========================================================================
    # REDIS EGRESS - OPTIONAL (for instant job dispatch)
    # =========================================================================
    # Redis pub/sub enables instant job notifications. Without Redis, workers
    # poll the database periodically (configured by VLOG_WORKER_POLL_INTERVAL).
    #
    # If you're NOT using Redis: Comment out or remove this entire section.
    # If you ARE using Redis: Configure one of the options below.
    #
    # -------------------------------------------------------------------------
    # OPTION A (CURRENTLY ACTIVE): External Redis with IP/CIDR
    # -------------------------------------------------------------------------
    # Use this if Redis runs outside the Kubernetes cluster.
    #
    # IMPORTANT: If not using Redis, COMMENT OUT this block to prevent
    # unnecessary egress permissions.
    #
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8  # <-- CHANGE to Redis server IP/CIDR, or comment out if not using Redis
      ports:
        - protocol: TCP
          port: 6379  # Redis default port

    # -------------------------------------------------------------------------
    # OPTION B (COMMENTED): In-cluster Redis
    # -------------------------------------------------------------------------
    # Use this if Redis runs as a K8s service in the same cluster.
    #
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: vlog  # Namespace where Redis runs
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: redis
    #   ports:
    #     - protocol: TCP
    #       port: 6379

    # =========================================================================
    # NFS/SMB STORAGE EGRESS - OPTIONAL (for NAS storage)
    # =========================================================================
    # Only needed if workers access video storage over NFS or SMB.
    # Note: hostPath volumes don't require network egress.
    #
    # This section is COMMENTED OUT by default. Uncomment if your workers
    # need to access a NAS device directly.
    #
    # - to:
    #     - ipBlock:
    #         cidr: 10.0.0.0/8  # <-- CHANGE to your NAS IP/CIDR
    #   ports:
    #     - protocol: TCP
    #       port: 2049  # NFS
    #     - protocol: TCP
    #       port: 445   # SMB
