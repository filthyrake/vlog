name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly scan on Sundays at midnight UTC
    # Purpose: Detect newly disclosed vulnerabilities in dependencies
    # even when no code changes have been made
    - cron: '0 0 * * 0'
  workflow_dispatch:

# github/codeql-action/upload-sarif needs security-events: write, otherwise the
# upload fails with "Resource not accessible by integration".
permissions:
  contents: read
  security-events: write

jobs:
  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  trivy-image:
    name: Trivy Container Image Scan (${{ matrix.name }})
    runs-on: self-hosted
    needs: trivy-filesystem
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            dockerfile: Dockerfile.worker-cpu-only
            image: vlog-worker:scan
          - name: postgres
            dockerfile: Dockerfile.postgres
            image: vlog-postgres:scan

    steps:
      - uses: actions/checkout@v7

      # This job builds a CPU worker image on every run. Without reclaiming
      # space first, layers and build cache from previous runs fill the disk.
      - name: Reclaim disk space
        run: |
          df -h /tmp "${RUNNER_TEMP:-/tmp}" /var/lib/docker 2>/dev/null || true
          docker builder prune -af --filter until=24h || true
          docker image prune -f || true
          df -h /tmp "${RUNNER_TEMP:-/tmp}" /var/lib/docker 2>/dev/null || true

      - name: Build Docker image for scanning
        run: |
          docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .

      # Trivy exports this worker image to a temp directory before analysing
      # it, and the runner's /tmp is too small - the scan died with "no space
      # left on device". Keep the export on the runner's own work volume.
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          image-ref: ${{ matrix.image }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'
          trivyignores: '.trivyignore'

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          image-ref: ${{ matrix.image }}
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          trivyignores: '.trivyignore'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          docker rmi ${{ matrix.image }} || true
          # Removing the tag alone leaves the build cache behind, which is what
          # actually accumulates between runs.
          docker builder prune -f || true

  dependency-check:
    name: Python Dependency Audit
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v7

      # Audit against the Python version we actually ship (the container images
      # install python3.12). The runner's default python3 is 3.9, and resolving
      # our unbounded ">=" requirements under 3.9 makes pip backtrack for about
      # an hour before aborting with "error: resolution-too-deep".
      #
      # actions/setup-python publishes no build for this runner's OS, so uv
      # provisions the interpreter instead. Its resolver also does not suffer
      # the backtracking blowup that made this job fail.
      - name: Provision Python 3.12 via uv
        run: |
          python3 -m venv .uv-bootstrap
          ./.uv-bootstrap/bin/pip install --upgrade pip uv
          ./.uv-bootstrap/bin/uv python install 3.12
          ./.uv-bootstrap/bin/uv venv --python 3.12 .venv
          .venv/bin/python --version

      - name: Install pip-audit and project dependencies
        run: |
          ./.uv-bootstrap/bin/uv pip install --python .venv/bin/python \
            --require-hashes -r requirements.lock
          ./.uv-bootstrap/bin/uv pip install --python .venv/bin/python -c requirements.lock pip-audit
          ./.uv-bootstrap/bin/uv pip install --python .venv/bin/python --no-deps -e .

      - name: Run pip-audit
        run: |
          source .venv/bin/activate
          pip-audit

  security-summary:
    name: Security Scan Summary
    runs-on: self-hosted
    needs: [trivy-filesystem, trivy-image, dependency-check]
    if: always()

    steps:
      - name: Check scan results
        run: |
          if [[ "${{ needs.dependency-check.result }}" != "success" ]]; then
            echo "::error::Python dependency audit did not succeed"
            exit 1
          fi
          if [[ "${{ needs.trivy-filesystem.result }}" != "success" ]]; then
            echo "::error::Trivy filesystem scan found critical/high vulnerabilities"
            exit 1
          fi

          if [[ "${{ needs.trivy-image.result }}" != "success" ]]; then
            echo "::error::Trivy image scan found critical/high vulnerabilities"
            exit 1
          fi

          echo "All security scans passed!"
